name: Eaglercraft Public Server saver

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Clone Eaglercraft-Server-Paper
      run: |
        git clone https://github.com/Eaglercraft-Templates/Eaglercraft-Server-Paper.git server
        cd server

    - name: Restore World from Repo
      run: |
        mkdir -p server/world
        if [ -d "world" ] && [ "$(ls -A world)" ]; then
          echo "✅ Restoring world from repo..."
          cp -r world/* server/world/
          echo "📁 World size: $(du -sh world | cut -f1)"
        else
          echo "ℹ️ No world backup found, starting fresh."
        fi

    - name: Create Web Directory & Copy index.html
      run: |
        mkdir -p web
        if [ -f "index.html" ]; then
          cp index.html web/
          echo "✅ Copied index.html to web/"
        else
          echo "⚠️ index.html not found, creating placeholder..."
          cat > web/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head><title>File Server</title></head>
<body>
<h1>📁 File Server</h1>
<p>Place your index.html in the repo root to serve it here.</p>
</body>
</html>
EOF
        fi

    - name: Start Python HTTP Server (Port 8000)
      run: |
        cd web
        python3 -m http.server 8000 &
        echo "✅ Web server started on port 8000"

    - name: Start Eaglercraft Server (Port 25565)
      run: |
        cd server
        chmod +x run.sh
        ./run.sh &
        echo "⏳ Waiting for server to start..."
        sleep 30
        echo "✅ Server should be running!"

    - name: Install Cloudflare Tunnel
      run: |
        curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared

    - name: Get Public URLs (Both Services)
      run: |
        echo "================================================"
        echo "🌐 PUBLIC URLs:"
        echo "================================================"
        echo ""
        echo "  🎮 EAGLERCRAFT:   https://tunnel-url/"
        echo "  📁 MEDIA PLAYER:  https://tunnel-url/a"
        echo ""
        echo "  ⚠️  URL changes every run!"
        echo "================================================"
        echo ""
        echo "🚀 Starting tunnel for both ports..."
        echo "   (Eaglercraft on 25565, Web on 8000)"
        echo ""

        # Run both services through the same tunnel
        ./cloudflared tunnel --url http://localhost:25565 --url http://localhost:8000 &
        
        sleep 10
        echo ""
        echo "✅ Tunnels active! Check logs above for URL."

        # Keep alive
        while true; do
          sleep 60
          echo "⏰ Tunnels still active - $(date)"
        done

    - name: Commit World Back to Repo
      if: always()
      run: |
        if [ -d "server/world" ] && [ "$(ls -A server/world)" ]; then
          echo "💾 Saving world to repo..."
          rm -rf world
          cp -r server/world world
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          git add world
          git diff --staged --quiet || git commit -m "💾 Auto-save world [skip ci]"
          git push
          echo "✅ World saved to repo!"
          echo "📁 World size: $(du -sh world | cut -f1)"
        else
          echo "⚠️ No world data to save"
        fi

    - name: Upload World as Artifact (Backup)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: world-backup-${{ github.run_id }}
        path: server/world
        retention-days: 90