name: Eaglercraft Public Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Clone Eaglercraft-Server-Paper
      run: |
        git clone https://github.com/Eaglercraft-Templates/Eaglercraft-Server-Paper.git server
        cd server

    - name: Restore World from Repo
      run: |
        mkdir -p server/world
        if [ -d "world" ] && [ "$(ls -A world)" ]; then
          echo "✅ Restoring world from repo..."
          cp -r world/* server/world/
          echo "📁 World size: $(du -sh world | cut -f1)"
        else
          echo "ℹ️ No world backup found, starting fresh."
        fi

    - name: Setup Web Directory
      run: |
        mkdir -p web
        if [ -f "index.html" ]; then
          cp index.html web/
          echo "✅ index.html copied to web/"
        else
          echo "⚠️ index.html not found in repo root"
        fi

    - name: Start Python HTTP Server
      run: |
        cd web
        python3 -m http.server 8000 &
        echo "✅ Web server started on port 8000"

    - name: Start Eaglercraft Server
      run: |
        cd server
        chmod +x run.sh
        ./run.sh &
        echo "⏳ Waiting for server to start..."
        sleep 30
        echo "✅ Server should be running!"

    - name: Install Cloudflare Tunnel
      run: |
        curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared

    - name: Start Tunnel for Eaglercraft
      run: |
        echo "🌐 Starting Cloudflare tunnel for Eaglercraft (port 25565)..."
        ./cloudflared tunnel --url http://localhost:25565 &
        sleep 5

    - name: Start Tunnel for Web Server
      run: |
        echo "🌐 Starting Cloudflare tunnel for Web Server (port 8000)..."
        echo "📁 Your index.html will be accessible at: /a"
        ./cloudflared tunnel --url http://localhost:8000 &
        sleep 5

    - name: Keep Tunnel Alive
      run: |
        echo "================================================"
        echo "🌐 PUBLIC URLs:"
        echo "================================================"
        echo ""
        echo "  🎮 EAGLERCRAFT:   Check logs above for URL"
        echo "  📁 MEDIA PLAYER:  Check logs above for URL (path: /a)"
        echo ""
        echo "  ⚠️  URLs change every run!"
        echo "================================================"
        echo ""
        echo "⏳ Keeping tunnels alive..."
        while true; do
          sleep 60
          echo "⏰ Tunnels still active - $(date)"
        done

    - name: Commit World Back to Repo
      if: always()
      run: |
        if [ -d "server/world" ] && [ "$(ls -A server/world)" ]; then
          echo "💾 Saving world to repo..."
          rm -rf world
          cp -r server/world world
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          git add world
          git diff --staged --quiet || git commit -m "💾 Auto-save world [skip ci]"
          git push
          echo "✅ World saved to repo!"
          echo "📁 World size: $(du -sh world | cut -f1)"
        else
          echo "⚠️ No world data to save"
        fi

    - name: Upload World as Artifact (Backup)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: world-backup-${{ github.run_id }}
        path: server/world
        retention-days: 90
