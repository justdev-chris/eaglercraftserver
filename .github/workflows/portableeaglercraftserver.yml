name: Eaglercraft Portable Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Setup Java (for building)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Clone Eaglercraft Server
      run: |
        git clone https://github.com/Eaglercraft-Templates/Eaglercraft-Server-Paper.git server
        
    - name: Download Portable JRE
      run: |
        Write-Host "Downloading portable JRE..."
        curl.exe -L -o jre.zip https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.12%2B7/OpenJDK17U-jre_x64_windows_hotspot_17.0.12_7.zip
        Write-Host "Extracting JRE..."
        Expand-Archive -Path jre.zip -DestinationPath .
        Write-Host "Finding extracted folder..."
        Get-ChildItem -Directory
        # Find the folder that starts with "jdk" or "openjdk"
        $jreFolder = Get-ChildItem -Directory | Where-Object { $_.Name -like "jdk-*" -or $_.Name -like "openjdk-*" } | Select-Object -First 1
        if ($jreFolder) {
            Write-Host "Renaming $($jreFolder.Name) to jre"
            Rename-Item -Path $jreFolder.FullName -NewName "jre"
        } else {
            Write-Host "ERROR: Could not find JRE folder!"
            Get-ChildItem -Directory
            exit 1
        }
        Write-Host "JRE setup complete!"
        Get-ChildItem -Directory
        
    - name: Download Cloudflare Tunnel
      run: |
        curl.exe -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
        
    - name: Create launcher scripts
      run: |
        @"
        @echo off
        title Eaglercraft Server
        echo ================================================
        echo  Starting Eaglercraft Server...
        echo ================================================
        echo.
        cd /d "%~dp0"
        set JAVA_HOME=%~dp0jre
        set PATH=%JAVA_HOME%\bin;%PATH%
        echo Using Java from: %JAVA_HOME%
        echo.
        echo Starting Minecraft server...
        start /min "Minecraft Server" "%~dp0jre\bin\java.exe" -Xmx1024M -Xms1024M -jar server\paper-1.12.2.jar nogui
        echo Waiting for server to start...
        timeout /t 15 /nobreak >nul
        echo.
        echo ================================================
        echo  🌐 SERVER IS PUBLIC AT:
        echo ================================================
        echo.
        echo Your server is now accessible via Cloudflare Tunnel!
        echo.
        cloudflared.exe tunnel --url http://localhost:25565
        pause
        "@ > run-server.bat
        
        @"
        @echo off
        title Eaglercraft Launcher
        echo ================================================
        echo  EAGLERCRAFT PUBLIC SERVER
        echo ================================================
        echo.
        echo This package includes its own Java runtime.
        echo No installation required!
        echo.
        echo Press any key to start the server...
        pause >nul
        start "Eaglercraft Server" run-server.bat
        echo.
        echo Server is starting in the other window!
        echo.
        echo To stop the server, close both windows.
        echo.
        pause
        "@ > start-server.bat
        
    - name: Create README
      run: |
        @"
        EAGLERCRAFT PUBLIC SERVER - PORTABLE WINDOWS VERSION
        ====================================================
        
        NO JAVA INSTALLATION REQUIRED! Everything is included.
        
        HOW TO USE:
        1. Extract the ZIP anywhere (USB drive, desktop, etc.)
        2. Double-click "start-server.bat"
        3. Wait for the server to start (about 15 seconds)
        4. A new window will show your public URL
        5. Share that URL with your friends!
        
        WHAT'S INCLUDED:
        - Eaglercraft Server (Paper 1.12.2)
        - Portable Java 17 JRE (no system install needed)
        - Cloudflare Tunnel for public access
        - Popular plugins: AuthMe, EaglerXRewind, SkinsRestorer, ViaVersion, etc.
        
        SYSTEM REQUIREMENTS:
        - Windows 10/11 (64-bit)
        - ~300MB free disk space
        - Internet connection for Cloudflare Tunnel
        
        NOTES:
        - The public URL changes each time you start
        - Your world saves inside the "server" folder
        - Server properties: server\server.properties
        - Close both windows or press Ctrl+C to stop
        
        PORTABLE: You can run this from a USB drive!
        "@ > README.txt
        
    - name: Package everything
      run: |
        New-Item -ItemType Directory -Force -Path package
        Copy-Item cloudflared.exe package\
        Copy-Item run-server.bat package\
        Copy-Item start-server.bat package\
        Copy-Item README.txt package\
        Copy-Item -Recurse server package\server
        Copy-Item -Recurse jre package\jre
        
    - name: List package contents (debug)
      run: |
        Write-Host "Package contents:"
        Get-ChildItem package
        Write-Host "JRE contents:"
        Get-ChildItem package\jre
        
    - name: Create ZIP
      run: |
        Compress-Archive -Path package\* -DestinationPath Eaglercraft-Portable.zip
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Eaglercraft-Portable-Windows
        path: Eaglercraft-Portable.zip
