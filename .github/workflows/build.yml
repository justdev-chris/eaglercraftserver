name: Eaglercraft Public Server

on:
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Max Players'
        required: false
        default: '20'
      server_port:
        description: 'Server Port'
        required: false
        default: '25565'

jobs:
  server:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io
        sudo systemctl start docker
        sudo usermod -aG docker $USER
    
    - name: Start Eaglercraft Server (Docker)
      run: |
        docker run -d \
          --name eaglercraft \
          -p ${{ github.event.inputs.server_port || 25565 }}:${{ github.event.inputs.server_port || 25565 }} \
          ghcr.io/yangchuansheng/eaglerx1.8server:1.12.1
        sleep 10
        docker ps
        docker logs eaglercraft
    
    - name: Install Cloudflare Tunnel
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
    
    - name: Get Public URL
      run: |
        echo "================================================"
        echo "🌐 SERVER IS PUBLIC AT:"
        echo "================================================"
        echo ""
        cloudflared tunnel --url http://localhost:${{ github.event.inputs.server_port || 25565 }}